name: astrbot_plugin_star_game
display_name: 娱乐圈星途（明星养成 · AI 事件 · NPC · 恋爱 · 结婚）
desc: >-
  QQ 群娱乐圈文字游戏：出道/签到/抽签/活动/比拼/排行，AI 实时生成事件、互动剧本、采访、微博舆论，
  人气独立成长，系统 NPC 会约战、恋爱；连签与 13 个成就自动解锁，几乎每个动作之后 AI 都会对当事人口头点评一句；
  NPC 会突然 @ 你搭话、等你回应；v3.1 加入星币经济与事务所/粉丝团/热搜榜/月度考勤/NPC 邀约；
  v3.2 把经济做成一整个循环：练功收场地费、通告发片酬、礼物必须先去礼品商店买（送真人或 NPC 都涨好感），
  恋爱之上还有结婚——NPC 好感够 90 就答应，真人玩家得自己点头；
  v3.4 全员图片化：面板/排行榜/艺人档案/玩法手册都是现场渲染的卡片，NPC 扩到 31 位并有了自己的日常
  （接代言、翻红、翻车、恋爱，属性星币粉丝都跟着变），成就扩到 25 个，每天 9 点 20 点自动播报娱乐头条。
help: >-
  群里 @机器人 发「帮助」默认发一张总览长图；接戏/采访/发博/搭讪/月报都是 AI 现场生成；
  出道/改名/运势/送礼/搭讪/表白/答应/拒绝/分手/签到/抽签/活动/比拼/发博/采访/接戏之后有概率追加一行 💬 点评，
  用的是机器人自己的人格；事件有概率落在系统 NPC 身上，只加减那个 NPC；
  连续签到 3/7/14/30 天有奖励，达成条件会自动播报成就；
  NPC 会突然找玩家搭话并 @ 他，回「回应 A」或「回应 你想说的话」；
  v3.2 起：「商店」看货架、「买 鲜花 2」进背包、「送礼 名字 礼物」消耗背包里的那一件；
  「求婚 名字」需要一枚 520 星币的求婚戒指，NPC 好感 ≥90 当场答应，真人会收到待办等「答应」/「拒绝」；
  已婚签到加成更高，「离婚」好感 -20、戒指不退；
  星币来源：签到 +8、活动演出费 +12（扣 10 场地费）、发博 +6、比拼胜 +10、采访 +25、接戏按表现分发片酬、邀约 +25~45
  v3.3 起：「属性」会现场画一张艺人卡（段位进度、四项条、人气条、星币/背包/成就/连签、今日待办、最近动态、伴侣），
  发「属性 文字」才看文字版；
  v3.4 起「排行」「明星 名字」「帮助」也都出图，帮助图是两列卡片版。
version: v3.4.0
